      - "Como Administrador de la natillera (tesorero), quiero cuota dentro de límites (paso: define las reglas de la natillera)"
      - "Como Administrador de la natillera (tesorero), quiero periodicidad y fechas válidas (paso: define las reglas de la natillera)"
  - epic_hint: "unirse a la natillera"
    mapa_ref: "mapa-historias.yaml#ACT-002"
    story_seeds:
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero invitación por enlace compartido (paso: recibe la invitación por Telegram)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero cobro automático por Interledger (paso: autoriza el cobro automático de la cuota)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero acepta monto y periodicidad (paso: autoriza el cobro automático de la cuota)"
  - epic_hint: "ahorrar cada periodo"
    mapa_ref: "mapa-historias.yaml#ACT-003"
    story_seeds:
      - "Como Administrador de la natillera (tesorero), quiero arranca con cupo mínimo (paso: ve arrancar la natillera)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero primera cuota cobrada a todos (paso: ve arrancar la natillera)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero débito automático de cuota (paso: paga la cuota del periodo)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero ve su aporte acumulado (paso: mira su aporte y el del grupo)"
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero ve total de la natillera (paso: mira su aporte y el del grupo)"
  - epic_hint: "recibir la liquidación"
