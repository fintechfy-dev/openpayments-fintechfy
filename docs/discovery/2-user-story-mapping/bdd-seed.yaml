    story_seeds:
      - "Como Participante de la natillera que ahorra para tener su dinero en diciembre, quiero pago a su billetera personal (paso: recibe su liquidación en diciembre)"

out_of_scope:
  - "ACT-004 participar en actividades: no está en el corte acordado en IMD (AD2 quedó ahora-no); va en REB-003"
  - "ACT-005 pedir un préstamo: es REB-002 «Crédito desde el ahorro», opcional al final de la hackathon solo si sobra tiempo; lo otorga la financiera"
  - "REB-003 «La natillera completa» (27 historias): validación de identidad y revisión financiera, invitación por usuario de Telegram, validación de billetera con 1 peso, rechazo de invitación, devolución por cupo incompleto, mora con recordatorios y «ya tengo el dinero», actividades y premios, liquidación con descuentos"
  - "Futuro declarado, sin rebanada: invitación por correo o celular; estimado de liquidación"

known_risks:
  - "SUP-001: Open Payments permite el cobro recurrente con una sola autorización del participante (por verificar en la primera hora del viernes, ENT-005 de IMD)"
  - "SUP-004: la Test Wallet maneja la moneda en que se define la natillera"
  - "SUP-005: una financiera vigilada acepta custodiar la cuenta del grupo (en la hackathon es simulada)"
  - "La rebanada tiene que construirse en las 9 horas del evento (viernes 10:30–17:30 con pausa y sábado 08:00–11:00); restricción externa, no apetito"
  - "VH-01 de IMD: si se construye sobre el motor propio, puede chocar con la regla «todo el código debe desarrollarse dentro de los dos días»; consulta pendiente a la organización"

