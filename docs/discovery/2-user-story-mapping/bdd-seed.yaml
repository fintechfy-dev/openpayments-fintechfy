project_context:
  problem_statement: >-
    Que el jurado de la hackathon de Open Payments Medellín (16 y 17 de
    octubre de 2026) lleve la propuesta a la ronda final y la premie por su
    aporte a la inclusión financiera. El problema de fondo: en la natillera
    tradicional un organizador del grupo guarda el dinero y hubo casos de
    autopréstamo o robo; por desconfianza, hoy se hacen menos natilleras.
    Natillera 2.0 quiere conservar la familiaridad del ahorro en grupo
    quitando el riesgo de custodia.
  business_outcome: >-
    Un grupo de demostración arma su natillera, cada participante (incluido el
    administrador) autoriza una sola vez el cobro, ve cobrada su cuota real con
    su aporte y el total del grupo a la vista y, con el tiempo acelerado,
    recibe su liquidación en su billetera.
  nugget: >-
    Un grupo de familiares o amigos ahorra junto para diciembre sin que nadie
    pueda tocar el dinero del grupo, viendo siempre lo suyo y lo de todos.

