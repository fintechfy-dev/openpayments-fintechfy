  - id: "REB-001"
    nombre: "Primera natillera de punta a punta"
    orden: 1
    proposito: "ganar"            # con prueba temprana de SUP-001/003/004 en la primera hora del viernes
    outcome:
      enunciado: >-
        un grupo de demostración arma su natillera, cada participante
        (incluido el administrador) autoriza una sola vez el cobro, ve cobrada
        su cuota real con su aporte y el total del grupo a la vista y, con el
        tiempo acelerado, recibe su liquidación en su billetera
      usuarios_objetivo: ["USR-001", "USR-002"]
      medicion:
        estado: "sin_medir"
        razon: "se observa por primera vez en la demo del 2026-10-17, en el registro del flujo de pago; no hay dato previo"
    actividades_excluidas:
      - { actividad: "ACT-004", razon: "las actividades especiales no están en el corte acordado en IMD (AD2 quedó ahora-no); van en la rebanada 3" }
