      medicion:
        estado: "sin_medir"
        razon: "no hay financiera identificada ni historial de pagos; en la hackathon sería simulado"
    actividades_excluidas: []
  - id: "REB-003"
    nombre: "La natillera completa"
    orden: 3
    proposito: "ganar"
    outcome:
