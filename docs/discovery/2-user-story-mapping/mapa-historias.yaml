version: "1.0"
mapa_id: "USM-001"
nombre: "Natillera 2.0 — recorrido de la natillera y rebanada de la hackathon"
arquetipo: "USM-VERDE"
fecha: "2026-10-14"
tipo_mapa: "despues"            # producto nuevo: se mapea el recorrido propuesto

decision:
  pendiente: >-
    qué rebanada del recorrido de la natillera se construye en las 9 horas de
    la hackathon de Open Payments para lograr AD1, PA1 y FI3 de IMD, y qué
    queda para las rebanadas siguientes
  quien_rol: "Proponente — negocio y producto (decisor)"
  fecha_limite: "2026-10-16"

# Taller: las dos personas que deciden por el equipo armaron marco, esqueleto
# y rebanado; el resto del equipo de la hackathon leyó el esqueleto y el
# cuerpo en la página compartida y estuvo en el cierre («estamos todo el
# equipo y todos acuerdan»).
modo: "taller"
asistentes:
  - rol: "Proponente — negocio y producto (decisor)"
  - rol: "Integrante del equipo de la hackathon"
  - rol: "Resto del equipo de la hackathon"

# El objetivo es la meta de hito de IMD, tal cual (elección del equipo:
# «Solo la hackathon»). El recorrido se mapea completo, de la creación del
# grupo a la liquidación de diciembre; la rebanada 1 lo cruza en flaco.
objetivo:
  enunciado: >-
    que el jurado de la hackathon de Open Payments Medellín lleve nuestra
    propuesta a la ronda final y la premie por su aporte a la inclusión
    financiera
  horizonte: "2026-10-17 (fin de la hackathon)"
  meta_origen:
    tipo: "imd"
    ref: "impact-mapping-discovery/sessions/IMD-20261014-natillera-2/mapa.yaml#meta_hito"

# El jurado no es usuario: mira la demo, no camina el recorrido.
usuarios:
  - id: "USR-001"
    rol: "Participante de la natillera que ahorra para tener su dinero en diciembre"   # ACT-002 de IMD
    prioridad: "ahora"
  - id: "USR-002"
    rol: "Administrador de la natillera (tesorero)"                                   # ACT-003 de IMD
    prioridad: "ahora"
  - id: "USR-003"
    rol: "Operador de la financiera que custodia y presta"                            # de ACT-004 de IMD
    prioridad: "ahora_no"

evidencia:
  - id: "EVI-001"
    tipo: "otro"
    ref: "C:/Users/WILLI/Downloads/Natillera 2.pdf (resumido como E-01..E-16 en impact-mapping-discovery/sessions/IMD-20261014-natillera-2/fuentes.md)"
    nota: "documento de la iniciativa: parámetros, estados, invitación, validación de billetera, cobro, mora, actividades, premios, préstamos y liquidación"
  - id: "EVI-002"
    tipo: "mapa_imd"
    ref: "impact-mapping-discovery/sessions/IMD-20261014-natillera-2/mapa.yaml"
    nota: "meta de hito, actores ACT-002/003/004, impactos del corte IMP-007/003/012 (anclas de outcome) y entregables ENT-001..006 (solo contexto)"
  - id: "EVI-003"
    tipo: "otro"
    ref: "impact-mapping-discovery/sessions/IMD-20261014-natillera-2/taller-crudo.md#el-río"
    nota: "los dos ríos del participante que dibujaron P1 y P2, personas que han estado en natilleras reales"
  - id: "EVI-004"
    tipo: "otro"
    ref: "impact-mapping-discovery/sessions/IMD-20261014-natillera-2/fuentes.md#lo-que-establece-la-hackathon"
    nota: "reglas del evento H-01..H-10: 9 horas de construcción, flujo de pago completo obligatorio en la demo, 5 minutos de pitch"

# ---------------------------------------------------------------------------
# FASE 2 — EL ESQUELETO. Cosecha: los dos ríos del taller IMD (EVI-003),
# completados con el PDF (EVI-001), cada paso con su fuente en comentario.
# Leído por el equipo el 2026-10-14 con «luego»: completo, con tres notas
# (pasos 3, 7 y 14). El administrador también ahorra: camina los pasos del
# participante desde el 6.
# ---------------------------------------------------------------------------
esqueleto:
  actividades:
    - { id: "ACT-001", nombre: "armar la natillera",        orden: 1 }
    - { id: "ACT-002", nombre: "unirse a la natillera",     orden: 2 }
    - { id: "ACT-003", nombre: "ahorrar cada periodo",      orden: 3 }
    - { id: "ACT-004", nombre: "participar en actividades", orden: 4 }
    - { id: "ACT-005", nombre: "pedir un préstamo",         orden: 5 }
    - { id: "ACT-006", nombre: "recibir la liquidación",    orden: 6 }
  pasos:
    # EVI-001 E-05
    - { id: "PAS-001", actividad: "ACT-001", orden: 1, nombre: "se registra y lo validan", usuarios: ["USR-002"], dolor: null }
    # EVI-001 E-06
    - { id: "PAS-002", actividad: "ACT-001", orden: 2, nombre: "define las reglas de la natillera", usuarios: ["USR-002"], dolor: null }
    # EVI-001 E-08 + río P2 · nota del equipo: por Telegram, con el nombre de usuario
    - { id: "PAS-003", actividad: "ACT-001", orden: 3, nombre: "invita a su grupo por Telegram", usuarios: ["USR-002"], dolor: null }
    # río P2 paso 1 · nota del equipo (Telegram)
    - { id: "PAS-004", actividad: "ACT-002", orden: 1, nombre: "recibe la invitación por Telegram", usuarios: ["USR-001"], dolor: null }
    # río P2 paso 2
    - { id: "PAS-005", actividad: "ACT-002", orden: 2, nombre: "acepta la invitación", usuarios: ["USR-001"], dolor: null }
    # río P2 paso 3 + EVI-001 E-09
    - { id: "PAS-006", actividad: "ACT-002", orden: 3, nombre: "da sus datos y su billetera", usuarios: ["USR-001", "USR-002"], dolor: null }
    # EVI-001 E-09 · nota del equipo: automático con las capacidades de Interledger
    - { id: "PAS-007", actividad: "ACT-002", orden: 4, nombre: "autoriza el cobro automático de la cuota", usuarios: ["USR-001", "USR-002"], dolor: null }
    # EVI-001 E-10
    - { id: "PAS-008", actividad: "ACT-003", orden: 1, nombre: "ve arrancar la natillera", usuarios: ["USR-001", "USR-002"], dolor: null }
    # río P1 «periodicamente ahorrar» + río P2 4a
    - { id: "PAS-009", actividad: "ACT-003", orden: 2, nombre: "paga la cuota del periodo", usuarios: ["USR-001", "USR-002"], dolor: null }
    # taller IMD, P1: «acceso transversal y transparente»
    - { id: "PAS-010", actividad: "ACT-003", orden: 3, nombre: "mira su aporte y el del grupo", usuarios: ["USR-001", "USR-002"], dolor: null }
    # río P1 «estar al dia» + EVI-001 E-12
    - { id: "PAS-011", actividad: "ACT-003", orden: 4, nombre: "se pone al día si se atrasó", usuarios: ["USR-001", "USR-002"], dolor: null }
    # EVI-001 E-11 + río P2 4b
    - { id: "PAS-012", actividad: "ACT-004", orden: 1, nombre: "crea una actividad", usuarios: ["USR-002"], dolor: null }
    # río P2 4b + EVI-001 E-13
    - { id: "PAS-013", actividad: "ACT-004", orden: 2, nombre: "paga su parte de la actividad", usuarios: ["USR-001", "USR-002"], dolor: null }
    # EVI-001 E-14 · nota del equipo: el administrador sabe quién gana, indica y ordena; el pago lo ejecuta la natillera
    - { id: "PAS-014", actividad: "ACT-004", orden: 3, nombre: "indica al ganador y ordena el premio", usuarios: ["USR-002"], dolor: null }
    # río P1 + río P2 4c + EVI-001 E-15
    - { id: "PAS-015", actividad: "ACT-005", orden: 1, nombre: "pide un préstamo a la financiera", usuarios: ["USR-001", "USR-002"], dolor: null }
    # río P1 último + río P2 5 + EVI-001 E-16
    - { id: "PAS-016", actividad: "ACT-006", orden: 1, nombre: "recibe su liquidación en diciembre", usuarios: ["USR-001", "USR-002"], dolor: null }

