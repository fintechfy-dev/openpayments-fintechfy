<!-- @dsCard group="Componentes" height=220 subtitle="Primario, secundario, fantasma, celebra" -->
<style>.pv{padding:24px;background:var(--superficie);color:var(--tinta);font-family:var(--font-body)}.pv h4{margin:0 0 8px;font:700 13px/18px var(--font-body);color:var(--tinta-suave)}</style>
<div class="pv nt" style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button class="nt-btn nt-btn--primario"><i data-i="billetera"></i>Autorizar mi cuota</button>
<button class="nt-btn nt-btn--secundario">Ver mi aporte</button>
<button class="nt-btn nt-btn--fantasma">Ahora no</button>
<button class="nt-btn nt-btn--celebra"><i data-i="premio"></i>Ver liquidación</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button class="nt-btn nt-btn--primario nt-btn--sm">Pequeño</button>
<button class="nt-btn nt-btn--secundario nt-btn--sm">Pequeño</button>
<button class="nt-btn nt-btn--primario" disabled>Esperando autorización</button>
</div>
<div style="max-width:360px"><a class="nt-btn nt-btn--primario nt-btn--bloque" href="#">Volver a Telegram</a></div>
</div>
<script>
document.querySelectorAll('[data-i]').forEach(function(e){e.outerHTML=Natillera.icono(e.getAttribute('data-i'),e.className)});
document.querySelectorAll('[data-b]').forEach(function(e){var p=e.getAttribute('data-b').split('.');e.outerHTML=Natillera.badge(p[0],p[1])});
document.querySelectorAll('[data-cop]').forEach(function(e){e.textContent=Natillera.formatoCOP(+e.getAttribute('data-cop'))});
</script>
