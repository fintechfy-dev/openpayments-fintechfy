<!-- @dsCard group="Marca" height=200 subtitle="Set base, trazo redondeado de 2px" -->
<style>.pv{padding:24px;background:var(--superficie);color:var(--tinta);font-family:var(--font-body)}.pv h4{margin:0 0 8px;font:700 13px/18px var(--font-body);color:var(--tinta-suave)}</style>
<div class="pv nt">
<style>.ic-g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.ic-c{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--superficie-elevada);border:1px solid var(--borde);border-radius:var(--radio-md);font-size:14px;line-height:20px}</style>
<div class="ic-g">
<div class="ic-c"><i data-i="cuota" class="nt-ico--lg"></i>cuota</div><div class="ic-c"><i data-i="grupo" class="nt-ico--lg"></i>grupo</div>
<div class="ic-c"><i data-i="billetera" class="nt-ico--lg"></i>billetera</div><div class="ic-c"><i data-i="candado" class="nt-ico--lg"></i>candado</div>
<div class="ic-c"><i data-i="calendario" class="nt-ico--lg"></i>calendario</div><div class="ic-c"><i data-i="premio" class="nt-ico--lg"></i>premio</div>
<div class="ic-c" style="color:var(--estado-aviso-texto)"><i data-i="alerta" class="nt-ico--lg"></i>alerta</div><div class="ic-c" style="color:var(--primario-texto)"><i data-i="check" class="nt-ico--lg"></i>check</div>
<div class="ic-c"><i data-i="reloj" class="nt-ico--lg"></i>reloj</div><div class="ic-c"><i data-i="punto" class="nt-ico--lg"></i>punto</div>
</div></div>
<script>
document.querySelectorAll('[data-i]').forEach(function(e){e.outerHTML=Natillera.icono(e.getAttribute('data-i'),e.className)});
document.querySelectorAll('[data-b]').forEach(function(e){var p=e.getAttribute('data-b').split('.');e.outerHTML=Natillera.badge(p[0],p[1])});
document.querySelectorAll('[data-cop]').forEach(function(e){e.textContent=Natillera.formatoCOP(+e.getAttribute('data-cop'))});
</script>
