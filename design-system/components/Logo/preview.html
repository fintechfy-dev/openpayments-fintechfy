<!-- @dsCard group="Marca" height=720 width=960 subtitle="Tu marranito en vector: versiones y avatar" -->
<style>.pv{padding:24px;background:var(--superficie);color:var(--tinta);font-family:var(--font-body)}.pv h4{margin:0 0 8px;font:700 13px/18px var(--font-body);color:var(--tinta-suave)}</style>
<div class="pv nt">
<style>.lg-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.lg-c{border-radius:var(--radio-lg);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:space-between;min-height:200px}
.lg-c img{display:block;max-width:100%;height:auto}.lg-k{align-self:flex-start;font:700 13px/18px var(--font-body)}.lg-b{background:var(--superficie-elevada);border:1px solid var(--borde)}
.lg-w{grid-column:span 2}.lg-row{display:flex;gap:18px;align-items:flex-end}.lg-row span{display:block;text-align:center;font-size:12px;color:var(--tinta-suave)}</style>
<div class="lg-g">
 <div class="lg-c lg-b"><span class="lg-k">Logo principal</span><img src="../../assets/logos/logo-principal.svg" width="190" alt="Natillera 2.0, Ahorrar juntos, siempre."></div>
 <div class="lg-c lg-b lg-w"><span class="lg-k">Horizontal, con y sin tagline</span><img src="../../assets/logos/logo-horizontal.svg" width="380" alt="Natillera 2.0"><img src="../../assets/logos/logo-horizontal-sin-tagline.svg" width="300" alt="Natillera 2.0 sin tagline"></div>
 <div class="lg-c lg-b"><span class="lg-k">Avatar Telegram</span><img src="../../assets/logos/avatar-telegram.svg" width="140" height="140" alt="Avatar del bot"></div>
 <div class="lg-c" style="background:#FFFFFF;border:1px solid var(--borde)"><span class="lg-k" style="color:#2C342F">Monocromático</span><img src="../../assets/logos/logo-mono.svg" width="170" alt=""></div>
 <div class="lg-c" style="background:#1C4A35"><span class="lg-k" style="color:#F2EDE7">Sobre fondo oscuro</span><img src="../../assets/logos/logo-oscuro.svg" width="190" alt=""></div>
 <div class="lg-c" style="background:#FFFFFF;border:1px solid var(--borde)"><span class="lg-k" style="color:#000000">Alto contraste</span><img src="../../assets/logos/logo-alto-contraste.svg" width="170" alt=""></div>
 <div class="lg-c lg-b"><span class="lg-k">Tamaños de lectura</span><div class="lg-row">
  <div><img src="../../assets/logos/simbolo.svg" width="96" alt=""><span>96 px</span></div><div><img src="../../assets/logos/simbolo.svg" width="48" alt=""><span>48</span></div>
  <div><img src="../../assets/logos/simbolo-pequeno.svg" width="32" alt=""><span>32</span></div><div><img src="../../assets/logos/simbolo-pequeno.svg" width="24" alt=""><span>24</span></div><div><img src="../../assets/logos/avatar-telegram.svg" width="40" alt=""><span>40</span></div></div></div>
</div>
<h4 style="margin-top:20px">Sobre fondos</h4>
<div class="lg-g">
 <div class="lg-c lg-w" style="min-height:0;background:#F2EDE7;border:1px solid var(--borde)"><img src="../../assets/logos/logo-horizontal.svg" width="320" alt=""></div>
 <div class="lg-c lg-w" style="min-height:0;background:#1C4A35"><img src="../../assets/logos/logo-horizontal-oscuro.svg" width="320" alt=""></div>
</div>
</div>
<script>
document.querySelectorAll('[data-i]').forEach(function(e){e.outerHTML=Natillera.icono(e.getAttribute('data-i'),e.className)});
document.querySelectorAll('[data-b]').forEach(function(e){var p=e.getAttribute('data-b').split('.');e.outerHTML=Natillera.badge(p[0],p[1])});
document.querySelectorAll('[data-cop]').forEach(function(e){e.textContent=Natillera.formatoCOP(+e.getAttribute('data-cop'))});
</script>
