<!-- @dsCard group="Componentes" height=240 subtitle="Normal, destacada y cálida" -->
<style>.pv{padding:24px;background:var(--superficie);color:var(--tinta);font-family:var(--font-body)}.pv h4{margin:0 0 8px;font:700 13px/18px var(--font-body);color:var(--tinta-suave)}</style>
<div class="pv nt" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div class="nt-card"><div class="nt-card__cabeza"><h3 class="nt-card__titulo">Tu aporte</h3><span data-b="participante.activo"></span></div>
<div class="nt-dato"><span class="nt-dato__etiqueta">Llevas</span><span class="nt-dato__valor" data-cop="150000"></span></div><p class="nt-muted" style="margin:8px 0 0;font-size:14px">3 de 12 cuotas</p></div>
<div class="nt-card nt-card--destacada"><div class="nt-card__cabeza"><h3 class="nt-card__titulo">Total del grupo</h3><i data-i="grupo"></i></div>
<div class="nt-dato"><span class="nt-dato__valor nt-dato__valor--verde" data-cop="1800000"></span></div><p style="margin:8px 0 0;font-size:14px">12 personas ahorrando</p></div>
<div class="nt-card nt-card--calida"><div class="nt-card__cabeza"><h3 class="nt-card__titulo">¿Quién guarda la plata?</h3><i data-i="candado"></i></div>
<p style="margin:0">Financiera Aliada, a nombre de la natillera. Nadie del grupo la puede sacar.</p></div>
</div>
<script>
document.querySelectorAll('[data-i]').forEach(function(e){e.outerHTML=Natillera.icono(e.getAttribute('data-i'),e.className)});
document.querySelectorAll('[data-b]').forEach(function(e){var p=e.getAttribute('data-b').split('.');e.outerHTML=Natillera.badge(p[0],p[1])});
document.querySelectorAll('[data-cop]').forEach(function(e){e.textContent=Natillera.formatoCOP(+e.getAttribute('data-cop'))});
</script>
