<!-- @dsCard group="Piezas aplicadas" height=440 subtitle="Mi préstamo: imagen del bot y detalle en la web" page -->
<style>.pv{padding:24px;background:var(--superficie);color:var(--tinta);font-family:var(--font-body)}.pv h4{margin:0 0 8px;font:700 13px/18px var(--font-body);color:var(--tinta-suave)}
.tc{width:540px;background:var(--superficie-elevada);border-radius:var(--radio-lg);box-shadow:var(--sombra-3);overflow:hidden}
.tc-top{background:var(--marca-fondo);color:#FFFFFF;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tc-n{display:flex;gap:10px;align-items:center;font:900 22px/26px var(--font-display);margin:0}.tc-s{font-size:14px;line-height:20px;margin:2px 0 0;opacity:.92}
.tc-b{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.tc-f{padding:14px 24px;background:var(--secundario-suave);display:flex;gap:10px;align-items:center;font-size:14px;line-height:20px}</style>
<div class="pv nt" style="display:flex;justify-content:center;background:var(--superficie-hundida)">
<div class="tc">
<div class="tc-top"><div><p class="tc-n"><i data-i="credito"></i>Tu préstamo</p><p class="tc-s">Financiera Aliada · desde el 15 de octubre</p></div><span data-b="credito.al_dia"></span></div>
<div class="tc-b">
 <div class="nt-dato"><span class="nt-dato__etiqueta">Te falta pagar</span><span class="nt-dato__valor" data-cop="142820"></span></div>
 <div class="nt-dato"><span class="nt-dato__etiqueta">Próxima cuota · 15 de enero</span><span class="nt-dato__valor nt-dato__valor--md nt-dato__valor--verde" data-cop="35705"></span></div>
 <div class="nt-progreso" style="grid-column:1/-1"><div class="nt-progreso__fila"><span>Cuotas del préstamo</span><span class="nt-num">2/6</span></div><div class="nt-cuotas" style="--n:6" aria-hidden="true"><span class="nt-cuota nt-cuota--pagada"></span><span class="nt-cuota nt-cuota--pagada"></span><span class="nt-cuota nt-cuota--hoy"></span><span class="nt-cuota"></span><span class="nt-cuota"></span><span class="nt-cuota"></span></div></div>
</div>
<div class="tc-f"><i data-i="candado" class="nt-ico--sm"></i><span>El préstamo es aparte: tu ahorro en <b>Los Primos</b> sigue intacto. Si una cuota queda pendiente, se descuenta de tu parte en diciembre.</span></div>
</div></div>
<script>
document.querySelectorAll('[data-i]').forEach(function(e){e.outerHTML=Natillera.icono(e.getAttribute('data-i'),e.className)});
document.querySelectorAll('[data-b]').forEach(function(e){var p=e.getAttribute('data-b').split('.');e.outerHTML=Natillera.badge(p[0],p[1])});
document.querySelectorAll('[data-cop]').forEach(function(e){e.textContent=Natillera.formatoCOP(+e.getAttribute('data-cop'))});
</script>
